    <!-- ============ SPLASH LOADER ============
         Inline on purpose: it paints the instant the HTML arrives, before the
         JS bundle downloads, so visitors never see a blank page. It is removed
         by src/main.tsx once the app has mounted (see hideSplash). -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.6rem;
        background: #f7f1e8;
        opacity: 1;
        transition: opacity 500ms ease, visibility 500ms ease;
      }
      #splash.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      body.splash-active { overflow: hidden; }
      .splash-ring-wrap { position: relative; width: 84px; height: 84px; }
      .splash-ring-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .splash-ring-wrap circle { fill: none; stroke-width: 3; stroke-linecap: round; }
      .splash-outer { animation: splash-spin 1.5s linear infinite; }
      .splash-outer circle { stroke: #4a1c2c; stroke-dasharray: 130 400; }
      .splash-inner { animation: splash-spin-rev 1.1s linear infinite; }
      .splash-inner circle { stroke: #b08d57; stroke-dasharray: 90 300; }
      .splash-dot {
        position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
        border-radius: 9999px; background: #b08d57; animation: splash-pulse 1.4s ease-in-out infinite;
      }
      .splash-brand {
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        font-size: 2rem; letter-spacing: 0.04em; color: #4a1c2c; margin: 0;
      }
      .splash-sub {
        font-family: 'Inter', system-ui, sans-serif; font-size: 0.7rem; letter-spacing: 0.3em;
        text-transform: uppercase; color: #b08d57; margin: -1rem 0 0;
        animation: splash-fade 1.8s ease-in-out infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-spin-rev { to { transform: rotate(-360deg); } }
      @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .55; } }
      @keyframes splash-fade { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .splash-outer, .splash-inner, .splash-dot, .splash-sub { animation-duration: 3s; }
      }
    </style>
    <noscript><style>#splash { display: none !important; } body.splash-active { overflow: auto; }</style></noscript>
  </head>
  <body class="splash-active">
    <div id="splash" role="status" aria-live="polite" aria-label="Loading Scent Stack">
      <div class="splash-ring-wrap" aria-hidden="true">
        <svg viewBox="0 0 64 64" class="splash-outer"><circle cx="32" cy="32" r="28" /></svg>
        <svg viewBox="0 0 64 64" class="splash-inner"><circle cx="32" cy="32" r="19" /></svg>
        <span class="splash-dot"></span>
      </div>
      <p class="splash-brand">Scent Stack</p>
      <p class="splash-sub">Loading</p>
    </div>
    <script>
      // Failsafe: never trap a visitor behind the splash, even if the app bundle fails to load.
      setTimeout(function () {
        var el = document.getElementById('splash');
        if (el) { el.classList.add('splash-hide'); document.body.classList.remove('splash-active'); }
      }, 10000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
