<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Example perfume collection dashboard</title><desc id="d">A sample dashboard showing a perfume collection broken down by fragrance family with bottle count, most-worn family and duplicate check.</desc><rect width="800" height="450" rx="20" fill="#f7f1e8"/><rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#b08d57" stroke-opacity=".35"/><text x="60" y="62" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#4a1c2c">Collection by fragrance family</text><text x="60" y="86" font-family="Inter,Arial,sans-serif" font-size="13" fill="#806b55">Example data — your tracker builds this from your own bottles</text><text x="60" y="137" font-family="Inter,Arial,sans-serif" font-size="14" fill="#2b2522">Woody</text><rect x="160" y="120" width="290" height="24" rx="6" fill="#4a1c2c" fill-opacity="0.95"/><text x="460" y="137" font-family="Inter,Arial,sans-serif" font-size="13" fill="#4a1c2c">5</text><text x="60" y="185" font-family="Inter,Arial,sans-serif" font-size="14" fill="#2b2522">Floral</text><rect x="160" y="168" width="232" height="24" rx="6" fill="#4a1c2c" fill-opacity="0.82"/><text x="402" y="185" font-family="Inter,Arial,sans-serif" font-size="13" fill="#4a1c2c">4</text><text x="60" y="233" font-family="Inter,Arial,sans-serif" font-size="14" fill="#2b2522">Fresh</text><rect x="160" y="216" width="174" height="24" rx="6" fill="#4a1c2c" fill-opacity="0.69"/><text x="344" y="233" font-family="Inter,Arial,sans-serif" font-size="13" fill="#4a1c2c">3</text><text x="60" y="281" font-family="Inter,Arial,sans-serif" font-size="14" fill="#2b2522">Gourmand</text><rect x="160" y="264" width="116" height="24" rx="6" fill="#4a1c2c" fill-opacity="0.56"/><text x="286" y="281" font-family="Inter,Arial,sans-serif" font-size="13" fill="#4a1c2c">2</text><text x="60" y="329" font-family="Inter,Arial,sans-serif" font-size="14" fill="#2b2522">Amber</text><rect x="160" y="312" width="58" height="24" rx="6" fill="#4a1c2c" fill-opacity="0.43"/><text x="228" y="329" font-family="Inter,Arial,sans-serif" font-size="13" fill="#4a1c2c">1</text><rect x="470" y="110" width="270" height="76" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".4"/><text x="490" y="150" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#4a1c2c">15</text><text x="490" y="171" font-family="Inter,Arial,sans-serif" font-size="12" fill="#806b55">bottles tracked</text><rect x="470" y="202" width="270" height="76" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".4"/><text x="490" y="242" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#4a1c2c">Woody</text><text x="490" y="263" font-family="Inter,Arial,sans-serif" font-size="12" fill="#806b55">most-worn family</text><rect x="470" y="294" width="270" height="76" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".4"/><text x="490" y="334" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#4a1c2c">1</text><text x="490" y="355" font-family="Inter,Arial,sans-serif" font-size="12" fill="#806b55">possible duplicate</text><text x="400" y="430" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="3" fill="#b08d57">SCENT STACK</text></svg>