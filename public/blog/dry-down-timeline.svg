<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Perfume opening, heart and dry-down timeline</title><desc id="d">A timeline of a single perfume spray: opening in the first minutes, heart within the first hour, and dry-down hours later.</desc><rect width="800" height="450" rx="20" fill="#f7f1e8"/><rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#b08d57" stroke-opacity=".35"/><text x="400" y="66" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#4a1c2c">The life of one spray</text><line x1="130" y1="215" x2="670" y2="215" stroke="#b08d57" stroke-width="3"/><circle cx="130" cy="215" r="16" fill="#4a1c2c"/><circle cx="130" cy="215" r="6" fill="#f7f1e8"/><text x="130" y="168" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#4a1c2c">Opening</text><text x="130" y="258" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1" fill="#b08d57">FIRST MINUTES</text><text x="130" y="284" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">Bright, sharp,</text><text x="130" y="304" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">your first impression</text><circle cx="400" cy="215" r="16" fill="#4a1c2c"/><circle cx="400" cy="215" r="6" fill="#f7f1e8"/><text x="400" y="168" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#4a1c2c">Heart</text><text x="400" y="258" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1" fill="#b08d57">WITHIN THE FIRST HOUR</text><text x="400" y="284" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">The fragrance</text><text x="400" y="304" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">settles into itself</text><circle cx="670" cy="215" r="16" fill="#4a1c2c"/><circle cx="670" cy="215" r="6" fill="#f7f1e8"/><text x="670" y="168" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#4a1c2c">Dry-down</text><text x="670" y="258" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1" fill="#b08d57">HOURS LATER</text><text x="670" y="284" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">What stays</text><text x="670" y="304" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">on your skin</text><text x="400" y="365" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#806b55">Jot a line at each stage — that is the whole journal habit.</text><text x="400" y="430" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="3" fill="#b08d57">SCENT STACK</text></svg>