<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Cost per wear example</title><desc id="d">Illustrated example of perfume cost per wear comparing three imaginary bottles by price and how often they are worn</desc><rect width="800" height="450" rx="20" fill="#f7f1e8"/><rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#b08d57" stroke-opacity=".35"/><text x="400" y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#4a1c2c" font-weight="normal" letter-spacing="0">Cost per wear = price ÷ number of wears</text><text x="400" y="74" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8a7a6a" font-weight="normal" letter-spacing="0">Example numbers for illustration only</text><text x="60" y="128" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#4a1c2c" font-weight="bold" letter-spacing="0">Everyday bottle</text><text x="60" y="148" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6b5b53" font-weight="normal" letter-spacing="0">$60 · worn 60×</text><rect x="300" y="112" width="400" height="40" rx="10" fill="#efe4d4"/><rect x="300" y="112" width="25" height="40" rx="10" fill="#b08d57"/><text x="335" y="138" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" fill="#4a1c2c" font-weight="bold" letter-spacing="0">$1.00 per wear</text><text x="60" y="226" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#4a1c2c" font-weight="bold" letter-spacing="0">Special-occasion bottle</text><text x="60" y="246" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6b5b53" font-weight="normal" letter-spacing="0">$120 · worn 24×</text><rect x="300" y="210" width="400" height="40" rx="10" fill="#efe4d4"/><rect x="300" y="210" width="126" height="40" rx="10" fill="#b08d57"/><text x="436" y="236" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" fill="#4a1c2c" font-weight="bold" letter-spacing="0">$5.00 per wear</text><text x="60" y="324" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#4a1c2c" font-weight="bold" letter-spacing="0">Impulse buy</text><text x="60" y="344" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6b5b53" font-weight="normal" letter-spacing="0">$90 · worn 6×</text><rect x="300" y="308" width="400" height="40" rx="10" fill="#efe4d4"/><rect x="300" y="308" width="380" height="40" rx="10" fill="#4a1c2c"/><text x="670" y="334" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="15" fill="#f7f1e8" font-weight="bold" letter-spacing="0">$15.00 per wear</text><text x="400" y="418" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#8a6b34" font-weight="normal" letter-spacing="0">The bottle you never wear is the most expensive one you own.</text></svg>