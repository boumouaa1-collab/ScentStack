<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Blind-buy checklist</title><desc id="d">Five-step checklist before blind-buying perfume: know your taste, read the notes, compare, sample first and check returns</desc><rect width="800" height="450" rx="20" fill="#f7f1e8"/><rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#b08d57" stroke-opacity=".35"/><text x="400" y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#4a1c2c" font-weight="normal" letter-spacing="0">The five-step blind-buy check</text><rect x="60" y="78" width="680" height="58" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".45"/><circle cx="100" cy="107" r="19" fill="#4a1c2c"/><text x="100" y="113" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#f7f1e8" font-weight="bold" letter-spacing="0">1</text><text x="140" y="103" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#4a1c2c" font-weight="bold" letter-spacing="0">Know your taste</text><text x="140" y="123" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6b5b53" font-weight="normal" letter-spacing="0">Which families and notes do you love — or avoid?</text><path d="M705 107 l8 8 l16 -18" fill="none" stroke="#b08d57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="148" width="680" height="58" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".45"/><circle cx="100" cy="177" r="19" fill="#4a1c2c"/><text x="100" y="183" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#f7f1e8" font-weight="bold" letter-spacing="0">2</text><text x="140" y="173" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#4a1c2c" font-weight="bold" letter-spacing="0">Read the notes</text><text x="140" y="193" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6b5b53" font-weight="normal" letter-spacing="0">Look at overall direction, not single ingredients</text><path d="M705 177 l8 8 l16 -18" fill="none" stroke="#b08d57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="218" width="680" height="58" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".45"/><circle cx="100" cy="247" r="19" fill="#4a1c2c"/><text x="100" y="253" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#f7f1e8" font-weight="bold" letter-spacing="0">3</text><text x="140" y="243" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#4a1c2c" font-weight="bold" letter-spacing="0">Compare</text><text x="140" y="263" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6b5b53" font-weight="normal" letter-spacing="0">Is it close to something you already know?</text><path d="M705 247 l8 8 l16 -18" fill="none" stroke="#b08d57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="288" width="680" height="58" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".45"/><circle cx="100" cy="317" r="19" fill="#4a1c2c"/><text x="100" y="323" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#f7f1e8" font-weight="bold" letter-spacing="0">4</text><text x="140" y="313" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#4a1c2c" font-weight="bold" letter-spacing="0">Sample first</text><text x="140" y="333" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6b5b53" font-weight="normal" letter-spacing="0">Wear a decant for a full day before the bottle</text><path d="M705 317 l8 8 l16 -18" fill="none" stroke="#b08d57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="358" width="680" height="58" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".45"/><circle cx="100" cy="387" r="19" fill="#4a1c2c"/><text x="100" y="393" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#f7f1e8" font-weight="bold" letter-spacing="0">5</text><text x="140" y="383" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#4a1c2c" font-weight="bold" letter-spacing="0">Check returns</text><text x="140" y="403" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6b5b53" font-weight="normal" letter-spacing="0">Then wait 48 hours before you buy</text><path d="M705 387 l8 8 l16 -18" fill="none" stroke="#b08d57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>