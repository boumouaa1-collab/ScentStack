<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Example fragrance taste profile</title><desc id="d">A sample taste profile showing fragrance families, favourite notes and notes to avoid.</desc><rect width="800" height="450" rx="20" fill="#f7f1e8"/><rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#b08d57" stroke-opacity=".35"/><text x="60" y="62" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#4a1c2c">Your taste profile</text><text x="60" y="86" font-family="Inter,Arial,sans-serif" font-size="13" fill="#806b55">Example — fill in your own favourites</text><text x="60" y="136" font-family="Inter,Arial,sans-serif" font-size="14" fill="#2b2522">Floral</text><rect x="160" y="120" width="240" height="20" rx="10" fill="#efe4d4"/><rect x="160" y="120" width="148" height="20" rx="10" fill="#b08d57"/><text x="60" y="188" font-family="Inter,Arial,sans-serif" font-size="14" fill="#2b2522">Woody</text><rect x="160" y="172" width="240" height="20" rx="10" fill="#efe4d4"/><rect x="160" y="172" width="204" height="20" rx="10" fill="#b08d57"/><text x="60" y="240" font-family="Inter,Arial,sans-serif" font-size="14" fill="#2b2522">Fresh</text><rect x="160" y="224" width="240" height="20" rx="10" fill="#efe4d4"/><rect x="160" y="224" width="96" height="20" rx="10" fill="#b08d57"/><text x="60" y="292" font-family="Inter,Arial,sans-serif" font-size="14" fill="#2b2522">Gourmand</text><rect x="160" y="276" width="240" height="20" rx="10" fill="#efe4d4"/><rect x="160" y="276" width="168" height="20" rx="10" fill="#b08d57"/><text x="60" y="344" font-family="Inter,Arial,sans-serif" font-size="14" fill="#2b2522">Spicy</text><rect x="160" y="328" width="240" height="20" rx="10" fill="#efe4d4"/><rect x="160" y="328" width="72" height="20" rx="10" fill="#b08d57"/><rect x="440" y="110" width="300" height="130" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".4"/><text x="460" y="140" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="2" fill="#b08d57">FAVOURITE NOTES</text><text x="460" y="170" font-family="Inter,Arial,sans-serif" font-size="15" fill="#4a1c2c">✓  vanilla</text><text x="460" y="194" font-family="Inter,Arial,sans-serif" font-size="15" fill="#4a1c2c">✓  sandalwood</text><text x="460" y="218" font-family="Inter,Arial,sans-serif" font-size="15" fill="#4a1c2c">✓  bergamot</text><rect x="440" y="260" width="300" height="130" rx="14" fill="#fff" stroke="#4a1c2c" stroke-opacity=".3"/><text x="460" y="290" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="2" fill="#4a1c2c">NOTES TO AVOID</text><text x="460" y="320" font-family="Inter,Arial,sans-serif" font-size="15" fill="#2b2522">✕  heavy musk</text><text x="460" y="344" font-family="Inter,Arial,sans-serif" font-size="15" fill="#2b2522">✕  strong patchouli</text><text x="460" y="368" font-family="Inter,Arial,sans-serif" font-size="15" fill="#2b2522">✕  sharp aldehydes</text><text x="400" y="430" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="3" fill="#b08d57">SCENT STACK</text></svg>