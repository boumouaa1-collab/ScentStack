<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Three steps to a signature scent</title><desc id="d">Three steps to finding a signature scent: notice what you love, narrow down notes and moods, then wear a shortlist until one feels like you.</desc><rect width="800" height="450" rx="20" fill="#f7f1e8"/><rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#b08d57" stroke-opacity=".35"/><text x="400" y="66" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#4a1c2c">From “I like it” to “that’s me”</text><circle cx="150" cy="190" r="52" fill="#4a1c2c"/><text x="150" y="204" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#f7f1e8">1</text><text x="150" y="278" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#4a1c2c">Notice</text><text x="150" y="306" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">What do you already</text><text x="150" y="326" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">reach for and love?</text><line x1="212" y1="190" x2="338" y2="190" stroke="#b08d57" stroke-width="2" stroke-dasharray="5 6"/><circle cx="400" cy="190" r="52" fill="#4a1c2c"/><text x="400" y="204" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#f7f1e8">2</text><text x="400" y="278" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#4a1c2c">Narrow</text><text x="400" y="306" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">Which notes and moods</text><text x="400" y="326" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">keep showing up?</text><line x1="462" y1="190" x2="588" y2="190" stroke="#b08d57" stroke-width="2" stroke-dasharray="5 6"/><circle cx="650" cy="190" r="52" fill="#4a1c2c"/><text x="650" y="204" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#f7f1e8">3</text><text x="650" y="278" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#4a1c2c">Commit</text><text x="650" y="306" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">Wear your shortlist</text><text x="650" y="326" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#2b2522">until one feels like you</text><text x="400" y="430" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="3" fill="#b08d57">SCENT STACK</text></svg>