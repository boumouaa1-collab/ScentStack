<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Perfume occasion guide</title><desc id="d">Occasion guide showing what to aim for in a perfume for work, everyday, date night, active days and formal events</desc><rect width="800" height="450" rx="20" fill="#f7f1e8"/><rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#b08d57" stroke-opacity=".35"/><text x="400" y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#4a1c2c" font-weight="normal" letter-spacing="0">What to aim for, occasion by occasion</text><rect x="60" y="78" width="680" height="58" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".45"/><rect x="60" y="78" width="200" height="58" rx="14" fill="#4a1c2c"/><rect x="230" y="78" width="30" height="58" fill="#4a1c2c"/><text x="160" y="114" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#f7f1e8" font-weight="bold" letter-spacing="0">Work</text><text x="284" y="114" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" fill="#4a1c2c" font-weight="normal" letter-spacing="0">Soft, clean, close to the skin</text><rect x="60" y="148" width="680" height="58" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".45"/><rect x="60" y="148" width="200" height="58" rx="14" fill="#4a1c2c"/><rect x="230" y="148" width="30" height="58" fill="#4a1c2c"/><text x="160" y="184" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#f7f1e8" font-weight="bold" letter-spacing="0">Everyday</text><text x="284" y="184" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" fill="#4a1c2c" font-weight="normal" letter-spacing="0">Easy, comfortable, reliable</text><rect x="60" y="218" width="680" height="58" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".45"/><rect x="60" y="218" width="200" height="58" rx="14" fill="#4a1c2c"/><rect x="230" y="218" width="30" height="58" fill="#4a1c2c"/><text x="160" y="254" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#f7f1e8" font-weight="bold" letter-spacing="0">Date night</text><text x="284" y="254" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" fill="#4a1c2c" font-weight="normal" letter-spacing="0">Warmer, richer, more personal</text><rect x="60" y="288" width="680" height="58" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".45"/><rect x="60" y="288" width="200" height="58" rx="14" fill="#4a1c2c"/><rect x="230" y="288" width="30" height="58" fill="#4a1c2c"/><text x="160" y="324" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#f7f1e8" font-weight="bold" letter-spacing="0">Active &amp; warm days</text><text x="284" y="324" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" fill="#4a1c2c" font-weight="normal" letter-spacing="0">Light, fresh — or skip it</text><rect x="60" y="358" width="680" height="58" rx="14" fill="#fff" stroke="#b08d57" stroke-opacity=".45"/><rect x="60" y="358" width="200" height="58" rx="14" fill="#4a1c2c"/><rect x="230" y="358" width="30" height="58" fill="#4a1c2c"/><text x="160" y="394" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#f7f1e8" font-weight="bold" letter-spacing="0">Formal events</text><text x="284" y="394" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" fill="#4a1c2c" font-weight="normal" letter-spacing="0">Memorable, polished, longer-lasting</text></svg>