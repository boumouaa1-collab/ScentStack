<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Nose blindness curve</title><desc id="d">Illustrative chart showing your awareness of a perfume fading faster than what people nearby notice</desc><rect width="800" height="450" rx="20" fill="#f7f1e8"/><rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#b08d57" stroke-opacity=".35"/><text x="400" y="56" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#4a1c2c" font-weight="normal" letter-spacing="0">How a perfume fades from your awareness</text><text x="400" y="80" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#8a7a6a" font-weight="normal" letter-spacing="0">Illustration of the idea — not measured data</text><line x1="90" y1="360" x2="720" y2="360" stroke="#d9c7b0"/><line x1="90" y1="120" x2="90" y2="360" stroke="#d9c7b0"/><path d="M90 140 C 190 150, 230 260, 330 300 S 560 335, 720 342" fill="none" stroke="#4a1c2c" stroke-width="4" stroke-linecap="round"/><path d="M90 140 C 220 140, 330 175, 450 215 S 640 255, 720 270" fill="none" stroke="#b08d57" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="90" cy="140" r="6" fill="#4a1c2c"/><text x="100" y="130" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="13" fill="#4a1c2c" font-weight="normal" letter-spacing="0">You spray it</text><text x="560" y="322" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" fill="#4a1c2c" font-weight="bold" letter-spacing="0">What you notice</text><text x="440" y="196" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" fill="#8a6b34" font-weight="bold" letter-spacing="0">What people nearby notice</text><text x="400" y="392" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#8a7a6a" font-weight="normal" letter-spacing="0">Time after applying  →</text><text transform="rotate(-90 66 240)" x="66" y="240" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#8a7a6a" font-weight="normal" letter-spacing="0">Strength</text></svg>