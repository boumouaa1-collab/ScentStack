<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5e2335"/>
      <stop offset="100%" stop-color="#4a1c2c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9bd8a"/>
      <stop offset="100%" stop-color="#b08d57"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- perfume bottle -->
  <g transform="translate(256,268)">
    <!-- cap -->
    <rect x="-38" y="-158" width="76" height="46" rx="10" fill="url(#gold)"/>
    <!-- neck -->
    <rect x="-14" y="-118" width="28" height="26" fill="url(#gold)"/>
    <!-- body -->
    <rect x="-92" y="-92" width="184" height="196" rx="20" fill="url(#gold)"/>
    <!-- body highlight facet -->
    <rect x="-92" y="-92" width="62" height="196" rx="20" fill="#f7f1e8" opacity="0.16"/>
    <!-- label -->
    <rect x="-58" y="-8" width="116" height="60" rx="6" fill="#4a1c2c"/>
    <rect x="-40" y="12" width="80" height="4" fill="#d9bd8a" opacity="0.85"/>
    <rect x="-40" y="26" width="56" height="4" fill="#d9bd8a" opacity="0.6"/>
  </g>

  <!-- flourish leaves -->
  <g stroke="url(#gold)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M 118 150 Q 150 118 190 120"/>
    <path d="M 394 150 Q 362 118 322 120"/>
  </g>
</svg>
